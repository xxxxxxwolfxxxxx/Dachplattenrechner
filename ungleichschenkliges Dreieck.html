  <div id="cookieBanner" class="cookie-banner">...</div>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    function showCookieBanner() {
      if (!localStorage.getItem('cookieConsent')) {
        document.getElementById('cookieBanner').classList.add('show');
      }
    }

    function acceptCookies() {
      localStorage.setItem('cookieConsent', 'all');
      localStorage.setItem('analyticsCookies', 'true');
      localStorage.setItem('marketingCookies', 'true');

      if (typeof gtag !== 'undefined') {
        gtag('config', 'G-6NSYG8B1T9', {
          anonymize_ip: true,
          cookie_flags: 'SameSite=None;Secure'
        });
      }

      document.getElementById('cookieBanner').classList.remove('show');
    }

    function declineCookies() {
      localStorage.setItem('cookieConsent', 'essential');
      localStorage.setItem('analyticsCookies', 'false');
      localStorage.setItem('marketingCookies', 'false');

      window['ga-disable-G-6NSYG8B1T9'] = true;
      document.getElementById('cookieBanner').classList.remove('show');
    }

    function openModal(type) {
      const modal = document.getElementById('modal');
      const modalBody = document.getElementById('modal-body');
      let content = '';

      if (type === 'kontakt') {
        content = `
          <h2>Kontakt</h2>
          <div class="contact-info">
            <h3>📧 E-Mail</h3>
            <p id="email-display"></p>
            <h3>📍 Adresse</h3>
            <p>Matthias Dührkop<br>Rhedewiesen 1<br>19258 Boizenburg/Elbe<br>Deutschland</p>
          </div>
        `;
      }

      modalBody.innerHTML = content;
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    function saveCookieSettings() {
      const analyticsCookies = document.getElementById('analyticsCookies').checked;
      localStorage.setItem('cookieConsent', 'custom');
      localStorage.setItem('analyticsCookies', analyticsCookies);

      if (analyticsCookies && typeof gtag !== 'undefined') {
        gtag('config', 'G-6NSYG8B1T9', {
          anonymize_ip: true,
          cookie_flags: 'SameSite=None;Secure'
        });
      } else {
        window['ga-disable-G-6NSYG8B1T9'] = true;
      }

      closeModal();
      alert('Cookie-Einstellungen gespeichert!');
    }

    function setupEmailProtection() {
      const encoded = 'eHh4eHdvbGZ4eHh4QG1lLmNvbQ==';
      const emailElements = ['email-contact', 'email-privacy', 'email-display'];

      emailElements.forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.innerHTML = `<span class="email-protection" onclick="revealEmail('${id}', '${encoded}')">E-Mail anzeigen</span>`;
        }
      });
    }

    function revealEmail(elementId, encoded) {
      const email = atob(encoded);
      document.getElementById(elementId).innerHTML = `<a href="mailto:${email}">${email}</a>`;
    }

    window.onclick = function(event) {
      const modal = document.getElementById('modal');
      if (event.target === modal) {
        closeModal();
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      showCookieBanner();
      setupEmailProtection();

      if (localStorage.getItem('cookieConsent') && window.initializeTracking) {
        window.initializeTracking();
      }
    });
  </script>
