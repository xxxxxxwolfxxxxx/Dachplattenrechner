# Erstellen Sie diese Datei als admin/config.yml in Ihrem GitHub Repository

backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Seiten"
    files:
      - name: "index"
        label: "Startseite"
        file: "index.html"
        fields:
          - label: "Seitentitel"
            name: "title"
            widget: "string"
            default: "Trapezplattenrechner"
          - label: "Header Farbe"
            name: "header_color"
            widget: "color"
            default: "#1e3c72"
          - label: "Sekundäre Farbe"
            name: "secondary_color"
            widget: "color"
            default: "#2a5298"
          - label: "Features"
            name: "features"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "string"}
              - {label: "Text", name: "text", widget: "string"}
      
      - name: "style"
        label: "Styling"
        file: "style.css"
        fields:
          - label: "Primäre Farbe"
            name: "primary_color"
            widget: "color"
            default: "#1e3c72"
          - label: "Sekundäre Farbe"
            name: "secondary_color"
            widget: "color"
            default: "#2a5298"
          - label: "Akzent Farbe"
            name: "accent_color"
            widget: "color"
            default: "#28a745"
          - label: "Warnung Farbe"
            name: "warning_color"
            widget: "color"
            default: "#ffc107"

  - name: "rechner"
    label: "Rechner-Seiten"
    folder: "."
    filter: {field: "layout", value: "rechner"}
    create: false
    fields:
      - label: "Titel"
        name: "title"
        widget: "string"
      - label: "Beschreibung"
        name: "description"
        widget: "text"
      - label: "Hauptfarbe"
        name: "main_color"
        widget: "color"
      - label: "Button Farbe"
        name: "button_color"
        widget: "color"

# Live-Vorschau aktivieren
local_backend: true
