<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trapezplattenrechner Admin</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // Konfiguration für Ihr CMS
    CMS.registerPreviewStyle('/style.css');
    
    // Custom Widget für Farbauswahl
    CMS.registerWidget('color', {
      controlComponent: ({ value, onChange }) => {
        return React.createElement('input', {
          type: 'color',
          value: value || '#1e3c72',
          onChange: (e) => onChange(e.target.value),
          style: { width: '100%', height: '40px', border: 'none', borderRadius: '4px' }
        });
      }
    });
    
    // Live-Vorschau für Styling-Änderungen
    CMS.registerPreviewTemplate('style', ({ entry }) => {
      const data = entry.getIn(['data']).toJS();
      return React.createElement('div', {
        style: {
          padding: '20px',
          background: data.primary_color,
          color: 'white',
          fontFamily: 'Arial, sans-serif'
        }
      }, [
        React.createElement('h1', { key: 'title' }, 'Trapezplattenrechner'),
        React.createElement('button', {
          key: 'button',
          style: {
            background: data.secondary_color,
            color: 'white',
            padding: '10px 20px',
            border: 'none',
            borderRadius: '5px',
            margin: '10px 0'
          }
        }, 'Beispiel Button'),
        React.createElement('div', {
          key: 'accent',
          style: {
            background: data.accent_color,
            padding: '10px',
            borderRadius: '5px',
            marginTop: '10px'
          }
        }, 'Akzent Bereich')
      ]);
    });
  </script>
  
  <script>
    // Netlify Identity für Authentifizierung
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
