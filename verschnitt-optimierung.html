<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verschnitt-Optimierung - Trapezplattenrechner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-header">
        <div class="container">
            <a href="index.html" class="back-btn">
                <span>←</span>
                <span>Zurück zur Übersicht</span>
            </a>
            <div class="nav-title">Verschnitt-Optimierung</div>
        </div>
    </div>

    <div class="container">
        <main>
            <h1 style="color: #1e3c72; text-align: center; margin-bottom: 30px;">Verschnitt-Optimierung</h1>

            <!-- Eingabe -->
            <div class="section">
                <h2>1. Benötigte Längen</h2>
                <div class="input-group">
                    <label for="benoetigte-masze">Benötigte Längen (eine pro Zeile)</label>
                    <textarea id="benoetigte-masze" rows="8" style="width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 6px; font-size: 16px; font-family: monospace;" placeholder="100x0.3"></textarea>
                </div>
            </div>

            <!-- Lagerlängen -->
            <div class="section">
                <h2>2. Verfügbare Lagerlängen</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-2.0">
                        <label for="lager-2.0" style="flex: 1; font-weight: 500;">2,0m</label>
                        <input type="number" id="anzahl-2.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-2.5">
                        <label for="lager-2.5" style="flex: 1; font-weight: 500;">2,5m</label>
                        <input type="number" id="anzahl-2.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-3.0">
                        <label for="lager-3.0" style="flex: 1; font-weight: 500;">3,0m</label>
                        <input type="number" id="anzahl-3.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-3.1" checked>
                        <label for="lager-3.1" style="flex: 1; font-weight: 500;">3,1m</label>
                        <input type="number" id="anzahl-3.1" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-3.5">
                        <label for="lager-3.5" style="flex: 1; font-weight: 500;">3,5m</label>
                        <input type="number" id="anzahl-3.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-4.0" checked>
                        <label for="lager-4.0" style="flex: 1; font-weight: 500;">4,0m</label>
                        <input type="number" id="anzahl-4.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-4.5">
                        <label for="lager-4.5" style="flex: 1; font-weight: 500;">4,5m</label>
                        <input type="number" id="anzahl-4.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-5.0" checked>
                        <label for="lager-5.0" style="flex: 1; font-weight: 500;">5,0m</label>
                        <input type="number" id="anzahl-5.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-5.5">
                        <label for="lager-5.5" style="flex: 1; font-weight: 500;">5,5m</label>
                        <input type="number" id="anzahl-5.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-6.0" checked>
                        <label for="lager-6.0" style="flex: 1; font-weight: 500;">6,0m</label>
                        <input type="number" id="anzahl-6.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-6.5">
                        <label for="lager-6.5" style="flex: 1; font-weight: 500;">6,5m</label>
                        <input type="number" id="anzahl-6.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-7.0">
                        <label for="lager-7.0" style="flex: 1; font-weight: 500;">7,0m</label>
                        <input type="number" id="anzahl-7.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-7.5">
                        <label for="lager-7.5" style="flex: 1; font-weight: 500;">7,5m</label>
                        <input type="number" id="anzahl-7.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-8.0">
                        <label for="lager-8.0" style="flex: 1; font-weight: 500;">8,0m</label>
                        <input type="number" id="anzahl-8.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-8.5">
                        <label for="lager-8.5" style="flex: 1; font-weight: 500;">8,5m</label>
                        <input type="number" id="anzahl-8.5" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: #f8f9fa;">
                        <input type="checkbox" id="lager-9.0">
                        <label for="lager-9.0" style="flex: 1; font-weight: 500;">9,0m</label>
                        <input type="number" id="anzahl-9.0" placeholder="∞" style="width: 60px; padding: 4px;">
                    </div>
                </div>
            </div>

            <!-- Einstellungen -->
            <div class="section">
                <h2>3. Einstellungen</h2>
                <div class="input-row">
                    <div class="input-group">
                        <label for="optimierung-modus">Optimierungsmodus</label>
                        <select id="optimierung-modus" style="width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 6px;">
                            <option value="verschnitt">Minimaler Verschnitt</option>
                            <option value="schnitte">Wenigste Schnitte</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="toleranz">Toleranz (mm)</label>
                        <input type="number" id="toleranz" value="5.0" style="width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 6px;">
                    </div>
                </div>
            </div>

            <button class="calculate-btn" onclick="starte()">🔧 Optimierung berechnen</button>

            <div id="results" class="results" style="display: none;">
                <div class="result-item">
                    <span>Benötigte Platten:</span>
                    <span id="anzahl-platten">-</span>
                </div>
                <div class="result-item">
                    <span>Gesamtverschnitt:</span>
                    <span id="gesamt-verschnitt">-</span>
                </div>
                
                <div id="saegeplan" style="margin-top: 25px;">
                    <h4>🪚 Sägeplan</h4>
                    <table class="schnitt-table">
                        <thead>
                            <tr>
                                <th>Platte</th>
                                <th>Lagerlänge</th>
                                <th>Teile</th>
                                <th>Verschnitt</th>
                            </tr>
                        </thead>
                        <tbody id="saegeplan-details">
                        </tbody>
                    </table>
                    
                    <div id="optimierung-tipp" style="margin-top: 20px; padding: 20px; background: #fff3cd; border-radius: 10px; display: none;">
                        <h4 style="color: #856404;">💡 Verschnitt-Optimierungstipp</h4>
                        <div id="tipp-text"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function starte() {
            console.log('Start Optimierung');
            
            try {
                // Eingabe parsen
                const masze = parseMasze();
                if (masze.length === 0) {
                    alert('Bitte Längen eingeben!');
                    return;
                }
                
                // Lagerlängen sammeln
                const lager = getLager();
                if (lager.length === 0) {
                    alert('Bitte Lagerlängen auswählen!');
                    return;
                }
                
                // Optimierung
                const result = optimiere(masze, lager);
                
                // Anzeigen
                zeige(result);
                
            } catch (error) {
                console.error('Fehler:', error);
                alert('Fehler: ' + error.message);
            }
        }

        function parseMasze() {
            const text = document.getElementById('benoetigte-masze').value;
            const lines = text.split('\n');
            const masze = [];
            
            for (let line of lines) {
                line = line.trim().replace(',', '.');
                if (!line) continue;
                
                if (line.includes('x')) {
                    const parts = line.split('x');
                    const anzahl = parseInt(parts[0]);
                    const wert = parseFloat(parts[1]);
                    
                    if (anzahl > 0 && wert > 0) {
                        for (let i = 0; i < anzahl; i++) {
                            masze.push(wert);
                        }
                    }
                } else {
                    const wert = parseFloat(line);
                    if (wert > 0) {
                        masze.push(wert);
                    }
                }
            }
            
            return masze;
        }

        function getLager() {
            const lager = [];
            const alle = [2.0, 2.5, 3.0, 3.1, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0];
            
            alle.forEach(laenge => {
                const checkbox = document.getElementById(`lager-${laenge}`);
                if (checkbox && checkbox.checked) {
                    lager.push(laenge);
                }
            });
            
            return lager.sort((a, b) => b - a);
        }

        function optimiere(masze, lager) {
            const toleranz = parseFloat(document.getElementById('toleranz').value) / 1000;
            const modus = document.getElementById('optimierung-modus').value;
            const result = [];
            const verbleibend = [...masze];
            
            let plattenNr = 1;
            
            while (verbleibend.length > 0) {
                let besteLaenge = null;
                let besteAnzahl = 0;
                let besterVerschnitt = Infinity;
                
                // Teste jede Lagerlänge
                for (let laenge of lager) {
                    const anzahl = berechneAnzahl(verbleibend[0], laenge, toleranz);
                    const verschnitt = laenge - (anzahl * (verbleibend[0] - toleranz));
                    
                    let istBesser = false;
                    if (modus === 'verschnitt') {
                        istBesser = verschnitt < besterVerschnitt;
                    } else {
                        istBesser = anzahl > besteAnzahl;
                    }
                    
                    if (istBesser && anzahl > 0) {
                        besteLaenge = laenge;
                        besteAnzahl = anzahl;
                        besterVerschnitt = verschnitt;
                    }
                }
                
                if (!besteLaenge) break;
                
                // Verwende beste Lösung
                const verwendeteTeile = [];
                for (let i = 0; i < Math.min(besteAnzahl, verbleibend.length); i++) {
                    verwendeteTeile.push(verbleibend.shift());
                }
                
                result.push({
                    plattenNr: plattenNr++,
                    lagerlaenge: besteLaenge,
                    teile: verwendeteTeile,
                    verschnitt: besterVerschnitt
                });
            }
            
            return result;
        }

        function berechneAnzahl(teilLaenge, lagerLaenge, toleranz) {
            const nettoTeil = teilLaenge - toleranz;
            if (nettoTeil <= 0) return 0;
            return Math.floor(lagerLaenge / nettoTeil);
        }

        function zeige(result) {
            const gesamtVerschnitt = result.reduce((sum, p) => sum + p.verschnitt, 0);
            
            document.getElementById('anzahl-platten').textContent = result.length + ' Stück';
            document.getElementById('gesamt-verschnitt').textContent = gesamtVerschnitt.toFixed(2) + ' m';
            
            // Tabelle füllen
            const tbody = document.getElementById('saegeplan-details');
            tbody.innerHTML = '';
            
            let tippText = '';
            
            result.forEach(platte => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>P${platte.plattenNr}</td>
                    <td>${platte.lagerlaenge}m</td>
                    <td>${platte.teile.length} × ${platte.teile[0]}m</td>
                    <td>${platte.verschnitt.toFixed(3)}m</td>
                `;
                tbody.appendChild(row);
                
                // Prüfe Optimierung
                if (platte.verschnitt > 0.001) {
                    const toleranz = parseFloat(document.getElementById('toleranz').value);
                    const zusatz = platte.verschnitt / platte.teile.length * 1000;
                    
                    if (zusatz <= toleranz) {
                        const alt = (platte.teile[0] - toleranz/1000) * 1000;
                        const neu = alt + zusatz;
                        tippText += `Platte ${platte.plattenNr}: ${alt.toFixed(1)}mm → ${neu.toFixed(1)}mm (kein Verschnitt)<br>`;
                    }
                }
            });
            
            if (tippText) {
                document.getElementById('tipp-text').innerHTML = tippText;
                document.getElementById('optimierung-tipp').style.display = 'block';
            }
            
            document.getElementById('results').style.display = 'block';
        }

        // Beispieldaten laden
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('benoetigte-masze').value = '100x0.3';
        });
    </script>
</body>
</html>
