<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Querstoß mit Überdeckung und Dichtband</title>
  <desc id="d">Seitenschnitt durch einen Querstoß zweier Trapezblech-Tafeln. Die obere Tafel überdeckt die untere auf 200 mm, ab 20 Grad Dachneigung genügen 150 mm. In der Überdeckung liegt ein Butyl-Dichtband zwischen den Tafeln. Das Dach fällt nach rechts zur Traufe.</desc>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--akzent)"/></marker>
  </defs>
  <style>
    :root { --bg:#ffffff; --fg:#0f172a; --blech:#64748b; --blech2:#0369a1; --holz:#c08a52; --akzent:#0369a1; --band:#b45309; --wasser:#38bdf8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e2e8f0; --blech:#94a3b8; --blech2:#7dd3fc; --holz:#a16f3d; --akzent:#38bdf8; --band:#fbbf24; --wasser:#38bdf8; } }
    .bg{fill:var(--bg)} .t{fill:var(--fg);font:600 18px system-ui,sans-serif}
    .k{fill:var(--fg);font:500 15px system-ui,sans-serif} .m{fill:var(--akzent);font:600 15px system-ui,sans-serif}
    .holz{fill:var(--holz);stroke:var(--fg);stroke-width:2}
    .bl{fill:none;stroke:var(--blech);stroke-width:5;stroke-linejoin:round}
    .bl2{fill:none;stroke:var(--blech2);stroke-width:5;stroke-linejoin:round}
    .rinne{fill:none;stroke:var(--fg);stroke-width:4;stroke-linejoin:round}
    .lin{stroke:var(--fg);stroke-width:1.5;fill:none}
    .ext{stroke:var(--akzent);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
    .mas{stroke:var(--akzent);stroke-width:2.5;fill:none}
    .band{fill:var(--band);stroke:var(--fg);stroke-width:1.5}
  </style>
  <rect class="bg" width="800" height="450"/>

  <text class="t" x="400" y="30" text-anchor="middle">Querstoß: Überdeckung und Dichtband im Schnitt</text>
  <path class="bl" d="M217.0 180.3 L246.6 185.5 L270.4 165.3 L300.0 170.5 L315.5 197.6 L345.1 202.8 L368.9 182.7 L398.5 187.9 L414.0 215.0 L443.5 220.2 L467.4 200.0 L497.0 205.3 L512.5 232.4 L542.0 237.6 L565.9 217.4 L595.4 222.6 L611.0 249.7 L640.5 254.9 L664.4 234.8"/>
  <path class="bl2" d="M22.9 129.8 L52.4 135.0 L76.3 114.8 L105.8 120.0 L121.3 147.1 L150.9 152.4 L174.7 132.2 L204.3 137.4 L219.8 164.5 L249.4 169.7 L273.2 149.6 L302.8 154.8 L318.3 181.9 L347.8 187.1 L371.7 166.9 L401.2 172.1 L416.8 199.2"/>
  <ellipse class="band" cx="238.1" cy="175.9" rx="6" ry="4.5"/>
  <line class="ext" x1="225.0" y1="135.0" x2="230.9" y2="101.5"/>
  <line class="ext" x1="422.0" y1="169.7" x2="427.9" y2="136.2"/>
  <line class="mas" x1="229.5" y1="109.4" x2="426.5" y2="144.1" marker-start="url(#pa)" marker-end="url(#pa)"/>
  <text class="m" x="328" y="67" text-anchor="middle">Überdeckung 200 mm</text>
  <text class="m" x="328" y="85" text-anchor="middle">ab 20° Neigung: 150 mm</text>
  <line class="lin" x1="328" y1="93" x2="328" y2="121"/>
  <text class="k" x="96" y="68" text-anchor="middle">obere Tafel</text>
  <line class="lin" x1="96" y1="74" x2="96" y2="112"/>
  <text class="k" x="561" y="299" text-anchor="middle">untere Tafel</text>
  <line class="lin" x1="561" y1="284" x2="561" y2="226"/>
  <polyline class="lin" points="226.3,173.8 193.8,168.1 187.2,205.5"/>
  <text class="k" x="187" y="228" text-anchor="middle">Butyl-Dichtband</text>
  <text class="k" x="400" y="425" text-anchor="middle">Dach fällt nach rechts zur Traufe · Unter 10° Neigung Querstöße vermeiden</text>
  <text class="k" x="400" y="445" text-anchor="middle" font-size="14">Zeichnung nicht maßstäblich · Profilhöhe schematisch</text>
</svg>
