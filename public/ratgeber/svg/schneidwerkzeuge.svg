<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Schneidwerkzeuge für Trapezblech im Vergleich</title>
  <desc id="d">Drei Draufsichten auf Blechtafeln. Links schneidet eine Blechschere eine einzelne Tafel, das ist bevorzugt. In der Mitte schneidet ein Winkelschleifer mit dünner Trennscheibe eine einzelne Tafel, das ist nur als Ausnahme gedacht. Rechts schneidet ein Winkelschleifer mit dicker Scheibe durch mehrere gestapelte Tafeln, das verbrennt Zink und Lack und ist zu vermeiden.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#0f172a; --blech:#cbd5e1; --ok:#047857; --warn:#b91c1c; --akzent:#0369a1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e2e8f0; --blech:#475569; --ok:#34d399; --warn:#f87171; --akzent:#38bdf8; } }
    .bg{fill:var(--bg)} .t{fill:var(--fg);font:600 18px system-ui,sans-serif}
    .k{fill:var(--fg);font:500 15px system-ui,sans-serif}
    .h{font:700 16px system-ui,sans-serif}
    .ok{fill:var(--ok)} .no{fill:var(--warn)}
    .tafel{fill:var(--blech);stroke:var(--fg);stroke-width:1.5}
    .schnitt{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    .lin{stroke:var(--fg);stroke-width:1.5;fill:none}
    .werk{fill:none;stroke:var(--fg);stroke-width:8;stroke-linecap:round}
    .pivot{fill:var(--bg);stroke:var(--fg);stroke-width:3}
    .scheibe{fill:none;stroke:var(--fg);stroke-width:3}
    .dick{fill:none;stroke:var(--warn);stroke-width:14}
    .kreuz{stroke:var(--warn);stroke-width:5;stroke-linecap:round}
    .haken{stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .spur{stroke:var(--fg);stroke-width:2;stroke-linecap:round}
  </style>
  <rect class="bg" width="800" height="450"/>
  <text class="t" x="400" y="30" text-anchor="middle">Zuschneiden: Welches Werkzeug wofür</text>

  <!-- Spalte 1: Schere -->
  <text class="h ok" x="140" y="72" text-anchor="middle">Bevorzugt</text>
  <rect class="tafel" x="40" y="110" width="200" height="140"/>
  <line class="schnitt" x1="140" y1="100" x2="140" y2="260"/>
  <line class="werk" x1="70" y1="150" x2="140" y2="180"/>
  <line class="werk" x1="70" y1="210" x2="140" y2="180"/>
  <circle class="pivot" cx="140" cy="180" r="7"/>
  <path class="haken" d="M205 88 L214 98 L232 76"/>
  <text class="k" x="140" y="300" text-anchor="middle">Knabber oder</text>
  <text class="k" x="140" y="320" text-anchor="middle">Blechschere</text>
  <line class="lin" x1="140" y1="254" x2="140" y2="286"/>

  <!-- Spalte 2: dünne Scheibe -->
  <text class="h ok" x="400" y="72" text-anchor="middle">Nur als Ausnahme</text>
  <rect class="tafel" x="300" y="110" width="200" height="140"/>
  <line class="schnitt" x1="400" y1="100" x2="400" y2="260"/>
  <circle class="scheibe" cx="400" cy="170" r="40"/>
  <circle class="pivot" cx="400" cy="170" r="6"/>
  <line class="spur" x1="440" y1="170" x2="462" y2="160"/>
  <line class="spur" x1="438" y1="184" x2="458" y2="196"/>
  <text class="k" x="400" y="300" text-anchor="middle">Winkelschleifer, dünne</text>
  <text class="k" x="400" y="320" text-anchor="middle">1-mm-Scheibe, Tafel einzeln</text>
  <line class="lin" x1="400" y1="254" x2="400" y2="286"/>

  <!-- Spalte 3: dicke Scheibe, Stapel -->
  <text class="h no" x="660" y="72" text-anchor="middle">Nicht so</text>
  <rect class="tafel" x="580" y="130" width="200" height="140"/>
  <rect class="tafel" x="570" y="120" width="200" height="140"/>
  <rect class="tafel" x="560" y="110" width="200" height="140"/>
  <line class="schnitt" x1="660" y1="100" x2="660" y2="280"/>
  <circle class="dick" cx="660" cy="170" r="40"/>
  <circle class="pivot" cx="660" cy="170" r="6"/>
  <line class="kreuz" x1="716" y1="82" x2="738" y2="102"/>
  <line class="kreuz" x1="738" y1="82" x2="716" y2="102"/>
  <text class="k" x="660" y="320" text-anchor="middle">dicke Scheibe, Tafeln gestapelt:</text>
  <text class="k" x="660" y="340" text-anchor="middle">verbrennt Zink und Lack</text>
  <line class="lin" x1="660" y1="274" x2="660" y2="306"/>

  <text class="k" x="400" y="400" text-anchor="middle">Immer: Schutzbrille, Gehörschutz, Handschuhe</text>
  <text class="k" x="400" y="425" text-anchor="middle">Danach Staub und Späne gründlich abwischen, sie rosten</text>
</svg>
