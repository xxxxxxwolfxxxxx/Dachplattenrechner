<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil definieren - Dachplattenrechner</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dachplattenrechner</h1>
            <nav class="progress-nav">
                <div class="step active" data-step="1">
                    <span class="step-number">1</span>
                    <span class="step-title">Profil</span>
                </div>
                <div class="step" data-step="2">
                    <span class="step-number">2</span>
                    <span class="step-title">Dachform</span>
                </div>
                <div class="step" data-step="3">
                    <span class="step-number">3</span>
                    <span class="step-title">Berechnung</span>
                </div>
                <div class="step" data-step="4">
                    <span class="step-number">4</span>
                    <span class="step-title">Anrissplan</span>
                </div>
            </nav>
        </header>

        <main>
            <section class="profile-section">
                <h2>Schritt 1: Profil definieren</h2>

                <form id="profileForm" class="profile-form">
                    <div class="card">
                        <h3>Profil auswählen</h3>
                        
                        <div class="form-group">
                            <label for="profil-kategorie">Kategorie:</label>
                            <select id="profil-kategorie" class="form-control">
                                <option value="">Bitte wählen...</option>
                                <option value="trapezprofil">Trapezprofil</option>
                                <option value="wellprofil">Wellprofil</option>
                                <option value="hochprofil">Hochprofil</option>
                                <option value="sandwich">Sandwich</option>
                                <option value="pfannenblech">Pfannenblech</option>
                            </select>
                        </div>
                        
                        <div class="form-group" id="profil-gruppe" style="display: none;">
                            <label for="profil-auswahl">Profil:</label>
                            <select id="profil-auswahl" class="form-control">
                                <option value="">Bitte wählen...</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="deckbreite">Deckbreite (mm):</label>
                                <input type="number" id="deckbreite" class="form-control" readonly>
                            </div>
                            <div class="form-group">
                                <label for="lieferbreite">Lieferbreite (mm):</label>
                                <input type="number" id="lieferbreite" class="form-control" readonly>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="profilname">Profilname:</label>
                            <input type="text" id="profilname" class="form-control" readonly>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Verfügbare Längen</h3>
                        <div class="form-group">
                            <label>
                                <input type="radio" name="laengentyp" value="lager" checked> 
                                Lagerlängen
                            </label>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="radio" name="laengentyp" value="bereich"> 
                                Bestellbereich
                            </label>
                        </div>

                        <div id="lager-section">
                            <div class="form-group">
                                <label for="lagerlaengen">Lagerlängen (mm, mit Komma):</label>
                                <input type="text" id="lagerlaengen" class="form-control" 
                                       placeholder="z.B. 2000, 3000, 4000, 5000, 6000">
                            </div>
                        </div>

                        <div id="bereich-section" style="display: none;">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="min-laenge">Min. Länge (mm):</label>
                                    <input type="number" id="min-laenge" class="form-control" value="1000">
                                </div>
                                <div class="form-group">
                                    <label for="max-laenge">Max. Länge (mm):</label>
                                    <input type="number" id="max-laenge" class="form-control" value="12000">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Einstellungen</h3>
                        <div class="form-group">
                            <label for="ueberstand">Überstand Traufe (mm):</label>
                            <input type="number" id="ueberstand" class="form-control" value="50">
                        </div>
                        
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="dach-teilen"> 
                                Große Dächer teilen (bei Längen über Plattenlänge)
                            </label>
                            <small class="form-text text-muted">
                                Bei großen Dächern werden mehrere Plattenreihen übereinander mit Längsüberlappung verwendet
                            </small>
                        </div>

                        <div id="laengsueberlappung-section" class="form-group" style="display: none; margin-left: 20px;">
                            <label for="laengsueberlappung">Längsüberlappung (mm):</label>
                            <select id="laengsueberlappung" class="form-control">
                                <option value="100">10 cm</option>
                                <option value="200" selected>20 cm</option>
                                <option value="300">30 cm</option>
                                <option value="400">40 cm</option>
                                <option value="500">50 cm</option>
                            </select>
                        </div>
                    </div>
                </form>

                <div class="navigation-buttons">
                    <button type="button" class="btn btn-secondary" onclick="goBack()">
                        ← Zurück
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveAndContinue()" id="continue-btn" disabled>
                        Weiter →
                    </button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 Dachplattenrechner</p>
        </footer>
    </div>

    <script>
        // Vereinfachter Profilkatalog
        const profile = {
            'trapezprofil': {
                'TP20': { name: 'TP20 (20/100)', deckbreite: 1000, lieferbreite: 1050 },
                'TP45': { name: 'TP45 (45/150)', deckbreite: 900, lieferbreite: 975 },
                'T35-207': { name: 'Profil 35.207', deckbreite: 1035, lieferbreite: 1085 },
                'T19-155': { name: 'Profil 19.155', deckbreite: 1090, lieferbreite: 1140 }
            },
            'wellprofil': {
                'SINUS18': { name: 'Sinus 18.76', deckbreite: 1070, lieferbreite: 1100 },
                'SINUS76': { name: 'Sinus 76/18', deckbreite: 1090, lieferbreite: 1131 }
            },
            'hochprofil': {
                'H85': { name: 'Hochprofil 85mm', deckbreite: 960, lieferbreite: 1000 },
                'H100': { name: 'Hochprofil 100mm', deckbreite: 930, lieferbreite: 1000 }
            },
            'sandwich': {
                'ISO40': { name: 'Isopaneel 40mm', deckbreite: 1000, lieferbreite: 1040 },
                'ISO60': { name: 'Isopaneel 60mm', deckbreite: 1000, lieferbreite: 1040 }
            },
            'pfannenblech': {
                'PFANNE': { name: 'Pfannenblech Standard', deckbreite: 1060, lieferbreite: 1100 },
                'STILLPANNA': { name: 'Stillpanna', deckbreite: 1040, lieferbreite: 1100 }
            }
        };

        let projectData = {};

        // Sichere Storage-Funktionen
        function saveData() {
            try {
                localStorage.setItem('dachplattenrechner_data', JSON.stringify(projectData));
                return true;
            } catch (e) {
                console.log('localStorage nicht verfügbar, verwende Session-Speicher');
                sessionStorage.setItem('dachplattenrechner_data', JSON.stringify(projectData));
                return true;
            }
        }

        function loadData() {
            try {
                let saved = localStorage.getItem('dachplattenrechner_data');
                if (!saved) {
                    saved = sessionStorage.getItem('dachplattenrechner_data');
                }
                return saved ? JSON.parse(saved) : null;
            } catch (e) {
                console.log('Fehler beim Laden der Daten');
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('profil-kategorie').addEventListener('change', loadProfile);
            document.getElementById('profil-auswahl').addEventListener('change', setProfilData);
            
            document.querySelectorAll('input[name="laengentyp"]').forEach(radio => {
                radio.addEventListener('change', toggleLengthSections);
            });

            document.getElementById('dach-teilen').addEventListener('change', toggleLaengsueberlappung);

            document.querySelectorAll('input, select').forEach(input => {
                input.addEventListener('input', validateForm);
                input.addEventListener('change', validateForm);
            });

            loadSavedData();
        });

        function loadProfile() {
            const kategorie = document.getElementById('profil-kategorie').value;
            const profilSelect = document.getElementById('profil-auswahl');
            const profilGruppe = document.getElementById('profil-gruppe');
            
            profilSelect.innerHTML = '<option value="">Bitte wählen...</option>';
            
            if (kategorie && profile[kategorie]) {
                Object.keys(profile[kategorie]).forEach(key => {
                    const p = profile[kategorie][key];
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = p.name;
                    profilSelect.appendChild(option);
                });
                profilGruppe.style.display = 'block';
            } else {
                profilGruppe.style.display = 'none';
            }
            
            clearProfilData();
            validateForm();
        }

        function setProfilData() {
            const kategorie = document.getElementById('profil-kategorie').value;
            const profilKey = document.getElementById('profil-auswahl').value;
            
            if (kategorie && profilKey && profile[kategorie] && profile[kategorie][profilKey]) {
                const p = profile[kategorie][profilKey];
                document.getElementById('deckbreite').value = p.deckbreite;
                document.getElementById('lieferbreite').value = p.lieferbreite;
                document.getElementById('profilname').value = p.name;
            } else {
                clearProfilData();
            }
            
            validateForm();
        }

        function clearProfilData() {
            document.getElementById('deckbreite').value = '';
            document.getElementById('lieferbreite').value = '';
            document.getElementById('profilname').value = '';
        }

        function toggleLaengsueberlappung() {
            const dachTeilen = document.getElementById('dach-teilen').checked;
            const section = document.getElementById('laengsueberlappung-section');
            section.style.display = dachTeilen ? 'block' : 'none';
        }

        function toggleLengthSections() {
            const isLager = document.querySelector('input[name="laengentyp"]:checked').value === 'lager';
            document.getElementById('lager-section').style.display = isLager ? 'block' : 'none';
            document.getElementById('bereich-section').style.display = isLager ? 'none' : 'block';
            validateForm();
        }

        function validateForm() {
            const deckbreite = document.getElementById('deckbreite').value;
            const lieferbreite = document.getElementById('lieferbreite').value;
            const isLager = document.querySelector('input[name="laengentyp"]:checked').value === 'lager';
            
            let lengthValid = false;
            if (isLager) {
                lengthValid = document.getElementById('lagerlaengen').value.trim() !== '';
            } else {
                const min = document.getElementById('min-laenge').value;
                const max = document.getElementById('max-laenge').value;
                lengthValid = min && max && parseInt(min) < parseInt(max);
            }
            
            const isValid = deckbreite && lieferbreite && lengthValid;
            document.getElementById('continue-btn').disabled = !isValid;
        }

        function saveAndContinue() {
            const isLager = document.querySelector('input[name="laengentyp"]:checked').value === 'lager';
            
            projectData = {
                profile: {
                    kategorie: document.getElementById('profil-kategorie').value,
                    profilKey: document.getElementById('profil-auswahl').value,
                    deckbreite: parseInt(document.getElementById('deckbreite').value),
                    lieferbreite: parseInt(document.getElementById('lieferbreite').value),
                    profilname: document.getElementById('profilname').value,
                    laengentyp: isLager ? 'lager' : 'bereich',
                    ueberstand: parseInt(document.getElementById('ueberstand').value) || 50,
                    laengsueberlappung: parseInt(document.getElementById('laengsueberlappung').value) || 200,
                    dachTeilen: document.getElementById('dach-teilen').checked
                }
            };

            if (isLager) {
                const lagerStr = document.getElementById('lagerlaengen').value;
                projectData.profile.lagerlaengen = lagerStr.split(',').map(l => parseInt(l.trim())).filter(l => !isNaN(l));
            } else {
                projectData.profile.minLaenge = parseInt(document.getElementById('min-laenge').value);
                projectData.profile.maxLaenge = parseInt(document.getElementById('max-laenge').value);
                projectData.profile.schnittRaster = 100;
            }

            try {
                saveData();
            } catch (e) {
                console.log('Speichern nicht möglich');
            }
            
            window.location.href = 'dachform.html';
        }

        function loadSavedData() {
            try {
                const data = loadData();
                if (data && data.profile) {
                    const p = data.profile;
                    
                    if (p.kategorie) {
                        document.getElementById('profil-kategorie').value = p.kategorie;
                        loadProfile();
                        
                        if (p.profilKey) {
                            document.getElementById('profil-auswahl').value = p.profilKey;
                            setProfilData();
                        }
                    }

                    if (p.laengentyp) {
                        document.querySelector(`input[name="laengentyp"][value="${p.laengentyp}"]`).checked = true;
                        toggleLengthSections();
                        
                        if (p.laengentyp === 'lager' && p.lagerlaengen) {
                            document.getElementById('lagerlaengen').value = p.lagerlaengen.join(', ');
                        } else if (p.laengentyp === 'bereich') {
                            if (p.minLaenge) document.getElementById('min-laenge').value = p.minLaenge;
                            if (p.maxLaenge) document.getElementById('max-laenge').value = p.maxLaenge;
                        }
                    }

                    if (p.ueberstand) document.getElementById('ueberstand').value = p.ueberstand;
                    if (p.dachTeilen) {
                        document.getElementById('dach-teilen').checked = p.dachTeilen;
                        toggleLaengsueberlappung();
                    }
                    if (p.laengsueberlappung) document.getElementById('laengsueberlappung').value = p.laengsueberlappung;
                    
                    validateForm();
                }
            } catch (e) {
                console.log('Keine gespeicherten Daten vorhanden');
            }
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
