<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Editor - Dachplattenrechner</title>
    <style>
        /* Styling für die Input-Gruppen mit eigenen Buttons */
        .input-group {
            display: inline-flex;
            align-items: center;
            position: relative;
        }
        
        .input-group input[type="number"] {
            width: 70px;
            height: 25px;
            text-align: center;
            border: 2px solid #007bff;
            border-radius: 5px 0 0 5px;
            font-weight: bold;
            background: white;
            -moz-appearance: textfield;
            padding-right: 20px;
        }
        
        .input-group input[type="number"]::-webkit-outer-spin-button,
        .input-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .input-group .spin-buttons {
            display: flex;
            flex-direction: column;
            height: 25px;
            border-left: none;
        }
        
        .input-group .spin-btn {
            width: 18px;
            height: 12px;
            background: #f0f0f0;
            border: 1px solid #007bff;
            border-left: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 8px;
            line-height: 1;
        }
        
        .input-group .spin-btn:first-child {
            border-bottom: none;
            border-radius: 0 5px 0 0;
        }
        
        .input-group .spin-btn:last-child {
            border-radius: 0 0 5px 0;
        }
        
        .input-group .spin-btn:hover {
            background: #e0e0e0;
        }
        
        .input-group .unit {
            position: absolute;
            right: 25px;
            color: #666;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Der bestehende HTML-Code bleibt gleich -->

    <script>
        // Ersetze die drawInputField Funktion mit dieser Version:
        function drawInputField(x, y, key, label) {
            const currentValue = currentDimensions[key] || 0;
            let min = "0.01", max = "100", step = "0.01";
            
            if (key === 'offset' || key === 'offsetX' || key === 'offsetY') {
                min = "-100";
                max = "100";
                step = "0.1";
            }
            
            return `<foreignObject x="${x - 50}" y="${y - 15}" width="110" height="30">
                      <div xmlns="http://www.w3.org/1999/xhtml" class="input-group">
                        <input type="number" 
                               value="${currentValue.toFixed(2)}" 
                               data-key="${key}" 
                               step="${step}" 
                               min="${min}" 
                               max="${max}" 
                               oninput="updateDimensionFromSVG('${key}', this.value)" />
                        <span class="unit">m</span>
                        <div class="spin-buttons">
                          <div class="spin-btn" onclick="adjustValue('${key}', ${step})">▲</div>
                          <div class="spin-btn" onclick="adjustValue('${key}', -${step})">▼</div>
                        </div>
                      </div>
                    </foreignObject>
                    <text x="${x}" y="${y - 20}" text-anchor="middle" fill="#007bff" font-size="12" font-weight="bold">${label}</text>`;
        }

        // Füge diese neue Funktion hinzu:
        function adjustValue(key, delta) {
            const input = document.querySelector(`input[data-key="${key}"]`);
            if (input) {
                let value = parseFloat(input.value) || 0;
                value += delta;
                
                // Grenzen überprüfen
                const min = parseFloat(input.min);
                const max = parseFloat(input.max);
                if (!isNaN(min)) value = Math.max(min, value);
                if (!isNaN(max)) value = Math.min(max, value);
                
                input.value = value.toFixed(2);
                updateDimensionFromSVG(key, value);
            }
        }

        // Der restliche JavaScript-Code bleibt unverändert
    </script>
</body>
</html>
