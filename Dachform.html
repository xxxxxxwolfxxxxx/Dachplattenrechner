<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Editor - Dachplattenrechner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Spezifische Styles für Dachform-Editor */
        .corners-selector { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
        .corner-option { background: white; border: 3px solid #e9ecef; border-radius: 15px; padding: 20px; cursor: pointer; transition: all 0.3s ease; text-align: center; min-width: 120px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .corner-option:hover { border-color: #667eea; transform: translateY(-5px); }
        .corner-option.selected { border-color: #667eea; background: linear-gradient(135deg, #f8f9ff 0%, #e3f2fd 100%); }
        .corner-number { font-size: 2.5em; font-weight: bold; color: #667eea; margin-bottom: 10px; }
        .corner-label { font-size: 1.1em; color: #495057; font-weight: 600; } 
        .corner-examples { font-size: 0.9em; color: #6c757d; margin-top: 5px; }

        .round-selector, .complex-selector { display: none; background: white; border-radius: 15px; padding: 25px; margin: 20px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .round-options, .complex-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .round-option, .complex-option { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .round-option:hover, .round-option.selected { border-color: #007bff; background: #e7f3ff; transform: translateY(-3px); }
        .complex-option:hover, .complex-option.selected { border-color: #28a745; background: #e8f5e8; transform: translateY(-3px); }
        .round-icon, .complex-icon { font-size: 2.5em; margin-bottom: 10px; }

        .editor-area { display: none; background: #f8f9fa; border-radius: 15px; padding: 30px; margin-top: 30px; }
        .editor-container { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; }
        .controls-panel { display: flex; flex-direction: column; gap: 25px; }
        .rotation-controls, .dimensions-panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .rotation-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .rotate-btn { padding: 12px; border: 2px solid #e9ecef; border-radius: 8px; background: white; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .rotate-btn:hover { border-color: #667eea; background: #f8f9ff; }
        .rotation-display { text-align: center; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 18px; font-weight: bold; color: #495057; margin-bottom: 15px; }
        .orientation-info { background: #e8f5e8; border-radius: 8px; padding: 15px; border-left: 5px solid #28a745; }
        .orientation-warning { background: #fff3cd; border-left: 5px solid #ffc107; }
        .preview-panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; }
        .preview-svg { width: 100%; height: 600px; border: 2px solid #e9ecef; border-radius: 10px; background: radial-gradient(circle at 20px 20px, #ddd 1px, transparent 1px), radial-gradient(circle at 60px 60px, #ddd 1px, transparent 1px); background-size: 40px 40px; }
        .info-panel { background: #e8f5e8; border-radius: 10px; padding: 20px; margin-top: 20px; border-left: 5px solid #28a745; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; } 
        .info-value { font-weight: bold; color: #28a745; }
        .shape-info { background: #fff3cd; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 5px solid #ffc107; }
        
        /* Styling für die neuen Input-Felder */
        .number-input-container { position: relative; display: inline-block; }
        .number-input-container input { 
            width: 70px; 
            height: 25px; 
            text-align: center; 
            border: 2px solid #007bff; 
            border-radius: 5px; 
            font-weight: bold; 
            background: white;
            padding-right: 15px; /* Platz für m-Einheit */
        }
        .unit-label {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 12px;
            font-weight: bold;
        }
        
        @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Der restliche HTML-Code bleibt gleich bis zur drawInputField Funktion -->
    
    <script>
        // Die bestehenden Funktionen bleiben gleich bis zur drawInputField Funktion

        // Ersetzte die drawInputField Funktion mit dieser neuen Version:
        function drawInputField(x, y, key, label) {
            const currentValue = currentDimensions[key] || 0;
            
            return `<foreignObject x="${x - 40}" y="${y - 15}" width="100" height="30">
                      <div xmlns="http://www.w3.org/1999/xhtml" class="number-input-container">
                        <input type="text"
                               inputmode="decimal"
                               value="${currentValue.toFixed(2)}" 
                               data-key="${key}"
                               oninput="validateNumberInput(this)"
                               style="width: 70px; height: 25px; text-align: center; border: 2px solid #007bff; border-radius: 5px; font-weight: bold; background: white;" />
                        <span class="unit-label">m</span>
                      </div>
                    </foreignObject>
                    <text x="${x}" y="${y - 20}" text-anchor="middle" fill="#007bff" font-size="12" font-weight="bold">${label}</text>`;
        }

        // Füge diese neue Validierungsfunktion hinzu:
        function validateNumberInput(input) {
            // Ersetze Komma durch Punkt für korrektes Parsing
            let value = input.value.replace(',', '.');
            
            // Entferne alle nicht-numerischen Zeichen außer Punkten
            value = value.replace(/[^0-9.]/g, '');
            
            // Stelle sicher, dass nur ein Dezimalpunkt vorhanden ist
            const parts = value.split('.');
            if (parts.length > 2) {
                value = parts[0] + '.' + parts.slice(1).join('');
            }
            
            // Aktualisiere den Wert im Eingabefeld
            input.value = value;
            
            // Aktualisiere die Dimensionen, wenn der Wert gültig ist
            if (value !== '' && !isNaN(value)) {
                updateDimensionFromSVG(input.getAttribute('data-key'), value);
            }
        }

        // Die bestehende updateDimensionFromSVG Funktion bleibt unverändert:
        function updateDimensionFromSVG(key, value) {
            const numValue = parseFloat(value);
            if (!isNaN(numValue)) {
                if (key === 'offset' || key === 'offsetX' || key === 'offsetY' || numValue > 0) {
                    currentDimensions[key] = numValue; 
                    updatePreview(); 
                    updateCalculations(); 
                    validateTriangle();
                }
            }
        }

        // Der restliche JavaScript-Code bleibt unverändert
    </script>
</body>
</html>
