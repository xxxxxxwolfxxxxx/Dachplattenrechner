<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farbauswahl - RAL & Prelaq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }
        
        /* Navigation Header */
        .nav-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .nav-title {
            color: #ffffff;
            font-size: 1.4em;
            font-weight: 600;
        }

        .close-btn-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn-header:hover {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        }
        
        .header {
            text-align: center;
            margin: 30px 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .color-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
            padding: 0 20px;
        }
        
        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.7);
            color: #1e3c72;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
        }
        
        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-2px);
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .color-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 3px solid transparent;
        }
        
        .color-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #1e3c72;
        }
        
        .color-card.selected {
            border-color: #27ae60;
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }
        
        .color-sample {
            height: 80px;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            font-size: 12px;
        }
        
        .color-info {
            padding: 12px;
            text-align: center;
        }
        
        .color-code {
            font-weight: bold;
            color: #1e3c72;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .color-name {
            font-size: 12px;
            color: #666;
            line-height: 1.3;
        }
        
        .search-box {
            max-width: 400px;
            margin: 0 auto 20px;
            position: relative;
            padding: 0 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }
        
        .selection-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid #27ae60;
            min-width: 200px;
            display: none;
        }
        
        .selection-info h3 {
            color: #27ae60;
            margin-bottom: 10px;
        }
        
        .confirm-btn {
            background: linear-gradient(135deg, #27ae60 0%, #219a52 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .confirm-btn:hover {
            background: linear-gradient(135deg, #219a52 0%, #1e8449 100%);
            transform: translateY(-2px);
        }
        
        .cancel-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        
        .cancel-btn:hover {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .color-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            
            .color-sample {
                height: 60px;
                font-size: 10px;
            }
            
            .color-info {
                padding: 8px;
            }
            
            .selection-info {
                bottom: 10px;
                right: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <div class="container">
            <a href="../index.html" class="back-btn">
                <span>←</span>
                <span>Zurück zur Übersicht</span>
            </a>
            <div class="nav-title">Farbauswahl</div>
            <button class="close-btn-header" onclick="window.close()">× Schließen</button>
        </div>
    </div>

    <div class="header">
        <h1>RAL & Prelaq Farben</h1>
        <p id="headerDescription">Wählen Sie eine RAL- oder Prelaq-Farbe für Ihr Kantteil</p>
    </div>
    
    <div class="color-tabs">
        <button class="tab-btn active" onclick="switchTab('ral')">RAL Farben</button>
        <button class="tab-btn" onclick="switchTab('prelaq')">Prelaq Farben</button>
    </div>
    
    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Farbe suchen (Code oder Name)...">
    </div>
    
    <!-- RAL Farben Tab -->
    <div id="ral-tab" class="tab-content active">

    </div>
    
    <!-- Prelaq Farben Tab -->

    </div>

        <button class="confirm-btn" onclick="confirmSelection()">Farbe übernehmen</button>
        <button class="cancel-btn" onclick="window.close()">Abbrechen</button>
    </div>

            '756': { color: '#DC143C', name: 'Karminrot' },
            '780': { color: '#800080', name: 'Purpur' },
            '801': { color: '#DAA520', name: 'Goldgelb' },
            '850': { color: '#FFA500', name: 'Orange' },
            '902': { color: '#000000', name: 'Schwarz' },
            '950': { color: '#FFFFFF', name: 'Weiß' }
        };

        let selectedColor = null;
        let currentTab = 'ral';

        // Tab wechseln
        function switchTab(tab) {
            currentTab = tab;
            
            // Tab Buttons aktualisieren
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Tab Content aktualisieren
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tab + '-tab').classList.add('active');
            
            // Suche zurücksetzen
            document.getElementById('searchInput').value = '';
            filterColors('');
        }

        // Farben rendern
        function renderColors(colors, gridId, type) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            
            Object.entries(colors).forEach(([code, data]) => {
                const card = document.createElement('div');
                card.className = 'color-card';
                card.onclick = () => selectColor(code, data.color, data.name, type);
                
                card.innerHTML = `
                    <div class="color-sample" style="background-color: ${data.color}">
                        ${type.toUpperCase()} ${code}
                    </div>
                    <div class="color-info">
                        <div class="color-code">${type.toUpperCase()} ${code}</div>
                        <div class="color-name">${data.name}</div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Farbe auswählen
        function selectColor(code, color, name, type) {
            // Vorherige Auswahl entfernen
            document.querySelectorAll('.color-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Neue Auswahl markieren
            event.currentTarget.classList.add('selected');
            
            selectedColor = {
                code: code,
                color: color,
                name: name,
                type: type
            };
            
            // Selection Info anzeigen
            const selectionInfo = document.getElementById('selectionInfo');
            const selectedColorInfo = document.getElementById('selectedColorInfo');
            
            selectedColorInfo.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <div style="width: 30px; height: 30px; background: ${color}; border-radius: 6px; border: 2px solid #ddd;"></div>
                    <div>
                        <div style="font-weight: bold;">${type.toUpperCase()} ${code}</div>
                        <div style="font-size: 12px; color: #666;">${name}</div>
                    </div>
                </div>
            `;
            
            selectionInfo.style.display = 'block';
            
            // Prüfe ob es ein Standalone-Modus ist (kein Parent-Window)
            if (!window.opener) {
                // Standalone-Modus - automatisch nach kurzer Zeit schließen
                setTimeout(() => {
                    selectionInfo.style.display = 'none';
                    document.querySelectorAll('.color-card').forEach(card => {
                        card.classList.remove('selected');
                    });
                    selectedColor = null;
                }, 2000);
            }
        }

        // Auswahl bestätigen
        function confirmSelection() {
            if (selectedColor && window.opener) {
                // Callback an Parent-Fenster
                if (window.opener.onColorSelected) {
                    window.opener.onColorSelected(selectedColor);
                }
            }
            window.close();
        }

        // Farben filtern
        function filterColors(searchTerm) {
            const term = searchTerm.toLowerCase();
            const colors = currentTab === 'ral' ? RAL_COLORS : PRELAQ_COLORS;
            
            if (!term) {
                renderColors(colors, currentTab + 'Grid', currentTab);
                return;
            }
            
            const filtered = {};
            Object.entries(colors).forEach(([code, data]) => {
                if (code.toLowerCase().includes(term) || 
                    data.name.toLowerCase().includes(term)) {
                    filtered[code] = data;
                }
            });
            
            renderColors(filtered, currentTab + 'Grid', currentTab);
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', function() {
            filterColors(this.value);
        });

        // Escape-Taste zum Schließen
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                window.close();
            }
        });

        // Initialisierung
        document.addEventListener('DOMContentLoaded', function() {
            renderColors(RAL_COLORS, 'ralGrid', 'ral');
            renderColors(PRELAQ_COLORS, 'prelaqGrid', 'prelaq');
            
            // Prüfe ob es ein Standalone-Modus ist
            if (!window.opener) {
                document.getElementById('headerDescription').textContent = 'Übersicht aller verfügbaren RAL- und Prelaq-Farben';
                
                // Verstecke Bestätigen-Button im Standalone-Modus
                const confirmBtn = document.querySelector('.confirm-btn');
                if (confirmBtn) {
                    confirmBtn.style.display = 'none';
                }
                
                // Ändere Cancel-Button Text
                const cancelBtn = document.querySelector('.cancel-btn');
                if (cancelBtn) {
                    cancelBtn.textContent = 'Fenster schließen';
                }
            }
        });
    </script>
</body>
</html>
