<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schnee- und Windlastkarte Deutschland - Dachplattenrechner</title>
    
    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-8687929894744033">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8687929894744033" crossorigin="anonymous"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
            overflow: hidden;
        }
        
        .nav-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-header .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .nav-title {
            color: #ffffff;
            font-size: 1.4em;
            font-weight: 600;
        }
        
        .map-container {
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }
        
        .tab-buttons {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            padding: 10px 20px;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .tab-btn:hover {
            color: #1e3c72;
        }
        
        .tab-btn.active {
            color: #1e3c72;
            border-bottom-color: #1e3c72;
        }
        
        .map-frame {
            flex: 1;
            width: 100%;
            border: none;
            display: none;
        }
        
        .map-frame.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="nav-header">
        <div class="container">
            <a href="index.html" class="back-btn">
                <span>←</span>
                <span>Zurück zur Übersicht</span>
            </a>
            <div class="nav-title">Schnee- & Windlastkarte Deutschland</div>
        </div>
    </div>

    <div class="map-container">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="wechselTab('schnee')">Schneelastkarte</button>
            <button class="tab-btn" onclick="wechselTab('wind')">Windlastkarte</button>
            <button class="tab-btn" onclick="wechselTab('erdbeben')">Erdbebenkarte</button>
        </div>
        
        <iframe id="schneeFrame" class="map-frame active" 
            src="https://www.dlubal.com/de/schnee-wind-erdbeben-lastzonen/schnee-din-en-1991-1-3.html">
        </iframe>
        
        <iframe id="windFrame" class="map-frame" 
            src="https://www.dlubal.com/de/schnee-wind-erdbeben-lastzonen/wind-din-en-1991-1-4.html">
        </iframe>
        
        <iframe id="erdbebenFrame" class="map-frame" 
            src="https://www.dlubal.com/de/schnee-wind-erdbeben-lastzonen/erdbeben-din-en-1998-1.html">
        </iframe>
    </div>

    <script>
        function wechselTab(typ) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.map-frame').forEach(frame => frame.classList.remove('active'));
            
            event.target.classList.add('active');
            
            if (typ === 'schnee') {
                document.getElementById('schneeFrame').classList.add('active');
            } else if (typ === 'wind') {
                document.getElementById('windFrame').classList.add('active');
            } else if (typ === 'erdbeben') {
                document.getElementById('erdbebenFrame').classList.add('active');
            }
        }

        window.onload = function() {
            setTimeout(function() {
                (adsbygoogle = window.adsbygoogle || []).push({});
            }, 1000);
        };
    </script>
</body>
</html>
