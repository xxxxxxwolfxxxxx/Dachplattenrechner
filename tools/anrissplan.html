            <button onclick="window.print()" class="btn btn-primary">
                Drucken

                Zurück zur Übersicht
            </a>
        </div>

        <!-- Übersichtssektion (wird beim Drucken ausgeblendet) -->
        <div class="overview-section" id="overview-section">
            <h3>Dachflächen-Übersicht</h3>
            <div id="overview-content">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>

        <!-- Plattencontainer -->
        <div id="plates-container">
            <!-- Wird dynamisch mit Platten gefüllt -->
        </div>
    </div>

    <script>
        // Globale Variablen
        let planData = null;
        let planType = null;

        // URL Parameter auslesen
        function getUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                type: urlParams.get('type'),
                data: urlParams.get('data')
            };
        }

        // Daten dekodieren
        function decodeData(encodedData) {
            try {
                return JSON.parse(decodeURIComponent(encodedData));
            } catch (e) {
                console.error('Fehler beim Dekodieren der Daten:', e);
                return null;
            }
        }

        // Header aktualisieren
        function updateHeader(type, data) {
            const titleElement = document.getElementById('plan-title');
            const infoElement = document.getElementById('plan-info');
            
            let title = '';
            let info = '';
            
            switch(type) {
                case 'gleichschenkliges-dreieck':
                    title = 'Anrissplan - Gleichschenkliges Dreieck';
                    info = `Basis: ${data.basisBreite}m | Höhe: ${data.hoehe}m | Spitze mittig | Platten: ${data.schnittliste.length} Stück`;
                    break;
                case 'ungleichschenkliges-dreieck':
                    title = 'Anrissplan - Ungleichschenkliges Dreieck';
                    info = `Basis: ${data.basisBreite}m | Höhe: ${data.hoehe}m | Spitze bei: ${data.spitzenPosition}m | Platten: ${data.schnittliste.length} Stück`;
                    break;
                case 'trapez':
                    title = 'Anrissplan - Trapez';
                    info = `Oben: ${data.obereBreite}m | Unten: ${data.untereBreite}m | Höhe: ${data.hoehe}m | Platten: ${data.schnittliste.length} Stück`;
                    break;
                case 'trapez-auf-rechteck':
                    title = 'Anrissplan - Trapez auf Rechteck';
                    info = `Oben: ${data.obereBreite}m | Unten: ${data.untereBreite}m | Trapez: ${data.trapezHoehe}m | Rechteck: ${data.rechteckHoehe}m | Platten: ${data.schnittliste.length} Stück`;
                    break;
                default:
                    title = 'Anrissplan - Unbekannter Typ';
                    info = 'Unbekannte Dachform';
            }
            
            titleElement.textContent = title;
            infoElement.innerHTML = `<strong>${title}:</strong> ${info}`;
        }

        // Übersicht generieren - KORRIGIERT mit ordentlicher Darstellung
        function generateOverview(type, data) {
            const container = document.getElementById('overview-content');
            
            let svg = '';
            
            switch(type) {
                case 'gleichschenkliges-dreieck':
                    svg = generateTriangleOverview(data, true);
                    break;
                case 'ungleichschenkliges-dreieck':
                    svg = generateTriangleOverview(data, false);
                    break;
                case 'trapez':
                    svg = generateTrapezOverview(data);
                    break;
                case 'trapez-auf-rechteck':
                    svg = generateTrapezRechteckOverview(data);
                    break;
                default:
                    svg = '<p>Unbekannte Dachform</p>';
            }
            
            container.innerHTML = `
                <div style="text-align: center; border: 2px solid #1e3c72; border-radius: 8px; padding: 20px; background: white; display: inline-block;">
                    ${svg}
                    <div style="margin-top: 15px; font-size: 14px; color: #666;">
                        <strong>Plattenaufteilung für ${data.schnittliste.length} Platten</strong>
                    </div>
                </div>
            `;
        }

        // Gleichschenkliges/Ungleichschenkliges Dreieck Übersicht - KORRIGIERT
        function generateTriangleOverview(data, isGleichschenklig) {
            const width = 500;
            const height = 300;
            const margin = 40;
            
            const basisBreite = parseFloat(data.basisBreite);
            const hoehe = parseFloat(data.hoehe);
            const spitzenPosition = isGleichschenklig ? basisBreite / 2 : parseFloat(data.spitzenPosition);
            
            const scaleX = (width - 2 * margin) / basisBreite;
            const scaleY = (height - 2 * margin - 40) / hoehe;
            
            const spitzeX = margin + spitzenPosition * scaleX;
            const spitzeY = margin;
            const linksX = margin;
            const linksY = margin + hoehe * scaleY;
            const rechtsX = margin + basisBreite * scaleX;
            const rechtsY = margin + hoehe * scaleY;
            
            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
            svg += `<rect width="${width}" height="${height}" fill="#fdfdfd"/>`;
            
            // Dreieck gefüllt
            svg += `<polygon points="${spitzeX},${spitzeY} ${linksX},${linksY} ${rechtsX},${rechtsY}" 
                     fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>`;
            
            // Platten als senkrechte Linien - KORRIGIERT für korrekte Höhenberechnung
            data.schnittliste.forEach((platte, index) => {
                const plattenStart = parseFloat(platte.positionVonLinks);
                const plattenX = margin + plattenStart * scaleX;
                
                // KORRIGIERTE Höhenberechnung - umgekehrte Logik für linke Seite
                let plattenObenY;
                if (plattenStart <= spitzenPosition) {
                    // Links von der Spitze - KORRIGIERT: Verhältnis umgekehrt berechnen
                    const verhaeltnis = (spitzenPosition - plattenStart) / spitzenPosition;
                    plattenObenY = linksY - verhaeltnis * (linksY - spitzeY);
                } else {
                    // Rechts von der Spitze - Linie zur rechten Dreiecksseite  
                    const abstandVonSpitze = plattenStart - spitzenPosition;
                    const rechteSeite = basisBreite - spitzenPosition;
                    const verhaeltnis = abstandVonSpitze / rechteSeite;
                    plattenObenY = spitzeY + verhaeltnis * (rechtsY - spitzeY);
                }
                
                svg += `<line x1="${plattenX}" y1="${linksY}" x2="${plattenX}" y2="${plattenObenY}" 
                        stroke="#666" stroke-width="1.5" opacity="0.8"/>`;
                        
                // Plattennummer
                svg += `<text x="${plattenX}" y="${linksY + 20}" 
                        text-anchor="middle" font-size="12" fill="#333" font-weight="bold">${platte.plattenNr}</text>`;
            });
            
            // Spitze markieren
            svg += `<circle cx="${spitzeX}" cy="${spitzeY}" r="4" fill="#dc3545"/>`;
            svg += `<text x="${spitzeX}" y="${spitzeY - 10}" text-anchor="middle" font-size="12" 
                    fill="#dc3545" font-weight="bold">Spitze</text>`;
            
            // Basis-Maß
            svg += `<line x1="${margin}" y1="${linksY + 30}" x2="${rechtsX}" y2="${linksY + 30}" stroke="#666" stroke-width="1"/>`;
            svg += `<text x="${margin + (basisBreite * scaleX)/2}" y="${linksY + 45}" text-anchor="middle" font-size="14" 
                    fill="#333" font-weight="bold">Basis: ${basisBreite}m</text>`;
            
            svg += `</svg>`;
            return svg;
        }

        // Trapez Übersicht
        function generateTrapezOverview(data) {
            const width = 500;
            const height = 300;
            const margin = 40;
            
            const obereBreite = parseFloat(data.obereBreite);
            const untereBreite = parseFloat(data.untereBreite);
            const hoehe = parseFloat(data.hoehe);
            
            const seitenAbstand = (untereBreite - obereBreite) / 2;
            const scaleX = (width - 2 * margin) / untereBreite;
            const scaleY = (height - 2 * margin - 40) / hoehe;
            
            const obenLinksX = margin + seitenAbstand * scaleX;
            const obenRechtsX = margin + (untereBreite - seitenAbstand) * scaleX;
            const obenY = margin;
            const untenLinksX = margin;
            const untenRechtsX = margin + untereBreite * scaleX;
            const untenY = margin + hoehe * scaleY;
            
            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
            svg += `<rect width="${width}" height="${height}" fill="#fdfdfd"/>`;
            
            // Trapez gefüllt
            svg += `<polygon points="${obenLinksX},${obenY} ${obenRechtsX},${obenY} ${untenRechtsX},${untenY} ${untenLinksX},${untenY}" 
                     fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>`;
            
            // Platten als senkrechte Linien
            data.schnittliste.forEach((platte, index) => {
                const plattenStart = parseFloat(platte.positionVonLinks);
                const plattenX = margin + plattenStart * scaleX;
                
                // Höhe an dieser Position berechnen
                const hoeheAnPosition = berechneHoeheAnPositionTrapez(plattenStart, seitenAbstand, untereBreite, hoehe);
                const plattenObenY = untenY - (hoeheAnPosition * scaleY);
                
                svg += `<line x1="${plattenX}" y1="${untenY}" x2="${plattenX}" y2="${plattenObenY}" 
                        stroke="#666" stroke-width="1.5" opacity="0.8"/>`;
                        
                // Plattennummer
                svg += `<text x="${plattenX}" y="${untenY + 20}" 
                        text-anchor="middle" font-size="12" fill="#333" font-weight="bold">${platte.plattenNr}</text>`;
            });
            
            // Obere Kante markieren
            svg += `<line x1="${obenLinksX}" y1="${obenY}" x2="${obenRechtsX}" y2="${obenY}" 
                    stroke="#28a745" stroke-width="3"/>`;
            svg += `<text x="${(obenLinksX + obenRechtsX)/2}" y="${obenY - 10}" 
                    text-anchor="middle" font-size="12" fill="#28a745" font-weight="bold">
                    Oben: ${obereBreite}m</text>`;
            
            // Untere Kante
            svg += `<text x="${margin + (untereBreite * scaleX)/2}" y="${height - 10}" 
                    text-anchor="middle" font-size="12" fill="#333" font-weight="bold">
                    Unten: ${untereBreite}m</text>`;
            
            svg += `</svg>`;
            return svg;
        }

        // Trapez auf Rechteck Übersicht
        function generateTrapezRechteckOverview(data) {
            const width = 500;
            const height = 350;
            const margin = 40;
            
            const obereBreite = parseFloat(data.obereBreite);
            const untereBreite = parseFloat(data.untereBreite);
            const trapezHoehe = parseFloat(data.trapezHoehe);
            const rechteckHoehe = parseFloat(data.rechteckHoehe);
            const gesamtHoehe = trapezHoehe + rechteckHoehe;
            
            const seitenAbstand = (untereBreite - obereBreite) / 2;
            const scaleX = (width - 2 * margin) / untereBreite;
            const scaleY = (height - 2 * margin - 40) / gesamtHoehe;
            
            const rechteckY = margin + trapezHoehe * scaleY;
            
            let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
            svg += `<rect width="${width}" height="${height}" fill="#fdfdfd"/>`;
            
            // Rechteck (unten)
            svg += `<rect x="${margin}" y="${rechteckY}" width="${untereBreite * scaleX}" 
                    height="${rechteckHoehe * scaleY}" fill="#e8f4fd" stroke="#1976d2" stroke-width="2"/>`;
            
            // Trapez (oben)
            const obenLinksX = margin + seitenAbstand * scaleX;
            const obenRechtsX = margin + (untereBreite - seitenAbstand) * scaleX;
            const untenRechtsX = margin + untereBreite * scaleX;
            
            svg += `<polygon points="${obenLinksX},${margin} ${obenRechtsX},${margin} ${untenRechtsX},${rechteckY} ${margin},${rechteckY}" 
                     fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>`;
            
            // Platten als senkrechte Linien über beide Bereiche
            data.schnittliste.forEach((platte, index) => {
                const plattenStart = parseFloat(platte.positionVonLinks);
                const plattenX = margin + plattenStart * scaleX;
                
                svg += `<line x1="${plattenX}" y1="${margin + gesamtHoehe * scaleY}" x2="${plattenX}" y2="${margin}" 
                        stroke="#666" stroke-width="1.5" opacity="0.8"/>`;
                        
                // Plattennummer
                svg += `<text x="${plattenX}" y="${margin + gesamtHoehe * scaleY + 20}" 
                        text-anchor="middle" font-size="12" fill="#333" font-weight="bold">${platte.plattenNr}</text>`;
            });
            
            // Übergang markieren
            svg += `<line x1="${margin}" y1="${rechteckY}" x2="${untenRechtsX}" y2="${rechteckY}" 
                    stroke="#ffc107" stroke-width="2" stroke-dasharray="5,5"/>`;
            svg += `<text x="${width/2}" y="${height - 10}" 
                    text-anchor="middle" font-size="12" fill="#333" font-weight="bold">
                    Trapez: ${trapezHoehe}m + Rechteck: ${rechteckHoehe}m</text>`;
            
            svg += `</svg>`;
            return svg;
        }

        // Hilfsfunktionen für Höhenberechnung in Übersicht
        function berechneHoeheAnPositionTriangle(position, basisBreite, maxHoehe, spitzenPosition) {
            const abstand = Math.abs(position - spitzenPosition);
            const maxAbstand = Math.max(spitzenPosition, basisBreite - spitzenPosition);
            
            if (abstand >= maxAbstand) return 0;
            return maxHoehe * (1 - abstand / maxAbstand);
        }

        function berechneHoeheAnPositionTrapez(position, seitenAbstand, untereBreite, hoehe) {
            if (position <= seitenAbstand) {
                return hoehe * (position / seitenAbstand);
            } else if (position >= (untereBreite - seitenAbstand)) {
                const abstandVonRechts = untereBreite - position;
                return hoehe * (abstandVonRechts / seitenAbstand);
            } else {
                return hoehe;
            }
        }

        // Einzelne Platte generieren - KORRIGIERT mit komplettem Links-Layout
        function generatePlate(item, index, type, data) {
            const plattenStart = parseFloat(item.positionVonLinks);
            const plattenEnde = parseFloat(item.positionBis);
            const plattenBreite = parseFloat(item.plattenbreite);
            const benoetigteLaengeM = parseFloat(item.benoetigteLaenge);
            
            // Anrissmaße berechnen basierend auf Typ
            const anreissMasse = calculateAnreissMasse(plattenStart, plattenEnde, type, data);
            
            return `
                <div class="anriss-plate">
                    <div style="display: flex; gap: 20px;">
                        <!-- Linke Seite: Überschrift, Maße UND Anweisungen -->
                        <div style="flex: 0 0 350px;">
                            <h3>Platte ${item.plattenNr} (Position: ${item.positionVonLinks}m - ${item.positionBis}m)</h3>
                            
                            <div style="margin: 15px 0; padding: 10px; background: #f0f8ff; border-radius: 6px;">
                                <div><strong>Links:</strong> ${anreissMasse.links}cm</div>
                                <div><strong>Rechts:</strong> ${anreissMasse.rechts}cm</div>
                                <div><strong>Benötigte Länge:</strong> ${item.benoetigteLaenge}m</div>
                            </div>
                            
                            <!-- Anweisungen auch links -->
                            <div style="background: #f8f9fa; border-left: 4px solid #ffc107; padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.4;">
                                ${generateInstructions(item, anreissMasse, type, data)}
                            </div>
                        </div>
                        
                        <!-- Rechte Seite: Nur Plattendiagramm -->
                        <div style="flex: 1; position: relative; height: 280px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd;">
                            ${generatePlateDiagram(item, anreissMasse, type, data)}
                        </div>
                    </div>
                </div>
            `;
        }

        // Anrissmaße berechnen
        function calculateAnreissMasse(plattenStart, plattenEnde, type, data) {
            let anreissLinks = 0;
            let anreissRechts = 0;
            
            switch(type) {
                case 'gleichschenkliges-dreieck':
                    const basisGleich = parseFloat(data.basisBreite);
                    const hoeheGleich = parseFloat(data.hoehe);
                    const spitzeGleich = basisGleich / 2;
                    
                    const hoeheStartGleich = berechneHoeheAnPositionGleich(plattenStart, basisGleich, hoeheGleich);
                    const hoeheEndeGleich = berechneHoeheAnPositionGleich(plattenEnde, basisGleich, hoeheGleich);
                    
                    anreissLinks = Math.round(hoeheStartGleich * 100);
                    anreissRechts = Math.round(hoeheEndeGleich * 100);
                    break;
                    
                case 'ungleichschenkliges-dreieck':
                    const spitzeUngleich = parseFloat(data.spitzenPosition);
                    const hoeheUngleich = parseFloat(data.hoehe);
                    const basisUngleich = parseFloat(data.basisBreite);
                    
                    const hoeheStartUngleich = berechneHoeheAnPositionUngleich(plattenStart, basisUngleich, hoeheUngleich, spitzeUngleich);
                    const hoeheEndeUngleich = berechneHoeheAnPositionUngleich(plattenEnde, basisUngleich, hoeheUngleich, spitzeUngleich);
                    
                    anreissLinks = Math.round(hoeheStartUngleich * 100);
                    anreissRechts = Math.round(hoeheEndeUngleich * 100);
                    break;
                    
                case 'trapez':
                    const obereBreiteTrapez = parseFloat(data.obereBreite);
                    const untereBreiteTrapez = parseFloat(data.untereBreite);
                    const hoeheTrapez = parseFloat(data.hoehe);
                    const seitenAbstandTrapez = (untereBreiteTrapez - obereBreiteTrapez) / 2;
                    
                    const hoeheStartTrapez = berechneHoeheAnPositionTrapez(plattenStart, seitenAbstandTrapez, untereBreiteTrapez, hoeheTrapez);
                    const hoeheEndeTrapez = berechneHoeheAnPositionTrapez(plattenEnde, seitenAbstandTrapez, untereBreiteTrapez, hoeheTrapez);
                    
                    anreissLinks = Math.round(hoeheStartTrapez * 100);
                    anreissRechts = Math.round(hoeheEndeTrapez * 100);
                    break;
                    
                case 'trapez-auf-rechteck':
                    const obereBreiteCombo = parseFloat(data.obereBreite);
                    const untereBreiteCombo = parseFloat(data.untereBreite);
                    const trapezHoeheCombo = parseFloat(data.trapezHoehe);
                    const rechteckHoeheCombo = parseFloat(data.rechteckHoehe);
                    const seitenAbstandCombo = (untereBreiteCombo - obereBreiteCombo) / 2;
                    
                    const hoeheStartCombo = berechneHoeheAnPositionCombo(plattenStart, seitenAbstandCombo, untereBreiteCombo, trapezHoeheCombo, rechteckHoeheCombo);
                    const hoeheEndeCombo = berechneHoeheAnPositionCombo(plattenEnde, seitenAbstandCombo, untereBreiteCombo, trapezHoeheCombo, rechteckHoeheCombo);
                    
                    anreissLinks = Math.round(hoeheStartCombo * 100);
                    anreissRechts = Math.round(hoeheEndeCombo * 100);
                    break;
            }
            
            return { links: anreissLinks, rechts: anreissRechts };
        }

        // Höhenberechnungen für verschiedene Formen
        function berechneHoeheAnPositionGleich(position, basisBreite, maxHoehe) {
            const spitzenPosition = basisBreite / 2;
            const abstand = Math.abs(position - spitzenPosition);
            const maxAbstand = basisBreite / 2;
            
            if (abstand >= maxAbstand) return 0;
            return maxHoehe * (1 - abstand / maxAbstand);
        }

        function berechneHoeheAnPositionUngleich(position, basisBreite, hoehe, spitzenPosition) {
            if (position <= 0) return 0;
            if (position >= basisBreite) return 0;
            
            let abstand;
            if (position <= spitzenPosition) {
                abstand = spitzenPosition - position;
                const linkeSeite = spitzenPosition;
                if (linkeSeite === 0) return hoehe;
                return hoehe * (1 - abstand / linkeSeite);
            } else {
                abstand = position - spitzenPosition;
                const rechteSeite = basisBreite - spitzenPosition;
                if (rechteSeite === 0) return hoehe;
                return hoehe * (1 - abstand / rechteSeite);
            }
        }

        function berechneHoeheAnPositionTrapez(position, seitenAbstand, untereBreite, hoehe) {
            if (position <= seitenAbstand) {
                return hoehe * (position / seitenAbstand);
            } else if (position >= (untereBreite - seitenAbstand)) {
                const abstandVonRechts = untereBreite - position;
                return hoehe * (abstandVonRechts / seitenAbstand);
            } else {
                return hoehe;
            }
        }

        function berechneHoeheAnPositionCombo(position, seitenAbstand, untereBreite, trapezHoehe, rechteckHoehe) {
            if (position <= seitenAbstand) {
                const prozent = position / seitenAbstand;
                return rechteckHoehe + (trapezHoehe * prozent);
            } else if (position >= (untereBreite - seitenAbstand)) {
                const abstandVonRechts = untereBreite - position;
                const prozent = abstandVonRechts / seitenAbstand;
                return rechteckHoehe + (trapezHoehe * prozent);
            } else {
                return trapezHoehe + rechteckHoehe;
            }
        }

        // Plattendiagramm generieren - KORRIGIERT mit intelligenter Abschnitt-Positionierung
        function generatePlateDiagram(item, anreissMasse, type, data) {
            const plattenStart = parseFloat(item.positionVonLinks);
            const plattenEnde = parseFloat(item.positionBis);
            const plattenBreite = parseFloat(item.plattenbreite);
            const benoetigteLaengeM = parseFloat(item.benoetigteLaenge);
            
            // Bestimme ob letzte Platte und Spitzenposition
            let basisBreite = 0;
            let spitzenPosition = 0;
            let istSpitzenPlatte = false;
            
            switch(type) {
                case 'gleichschenkliges-dreieck':
                    basisBreite = parseFloat(data.basisBreite);
                    spitzenPosition = basisBreite / 2;
                    istSpitzenPlatte = plattenStart <= spitzenPosition && (plattenStart + plattenBreite) >= spitzenPosition;
                    break;
                case 'ungleichschenkliges-dreieck':
                    basisBreite = parseFloat(data.basisBreite);
                    spitzenPosition = parseFloat(data.spitzenPosition);
                    istSpitzenPlatte = plattenStart <= spitzenPosition && (plattenStart + plattenBreite) >= spitzenPosition;
                    break;
                case 'trapez':
                case 'trapez-auf-rechteck':
                    basisBreite = parseFloat(data.untereBreite);
                    break;
            }
            
            const originalPlattenEnde = plattenStart + plattenBreite;
            const istLetztePlatte = originalPlattenEnde > basisBreite;
            const plattenEndeReal = istLetztePlatte ? basisBreite : plattenEnde;
            
            // SVG Dimensionen
            const plattenX = 30;
            const plattenY = 20;
            const plattenWidth = 300;
            const plattenHeight = 80;
            
            // Berechne tatsächliche Plattenbreite für Darstellung
            const dargestellteBreite = plattenEndeReal - plattenStart;
            const endX = (dargestellteBreite / plattenBreite) * plattenWidth;
            
            // Anriss-Höhen berechnen
            const anrissHoeheLinks = (anreissMasse.links / 100 / benoetigteLaengeM) * plattenHeight;
            const anrissHoeheRechts = (anreissMasse.rechts / 100 / benoetigteLaengeM) * plattenHeight;
            
            // Y-Koordinaten (von unten nach oben)
            let nutzenStartY = plattenY + plattenHeight - anrissHoeheLinks;
            let nutzenEndY = plattenY + plattenHeight - anrissHoeheRechts;
            
            // Bei Spitzenplatte: Schnittlinie zur Spitze
            let spitzeX = 0;
            if (istSpitzenPlatte) {
                const spitzeVonLinks = spitzenPosition - plattenStart;
                spitzeX = plattenX + (spitzeVonLinks / plattenBreite) * plattenWidth;
            }
            
            // Intelligente "Abschnitt" Positionierung
            let abschnittTexte = '';
            if (istSpitzenPlatte) {
                // Bei Dreieck mit Spitze: Links UND rechts der Spitze
                const linkerAbschnittX = plattenX + (spitzeX - plattenX) / 2;
                const rechterAbschnittX = spitzeX + (plattenX + endX - spitzeX) / 2;
                
                // Nur anzeigen wenn genug Platz (mindestens 30px)
                if (spitzeX - plattenX > 30) {
                    abschnittTexte += `<text x="${linkerAbschnittX}" y="${plattenY - 5}" text-anchor="middle" 
                          fill="#333" font-weight="bold" font-size="12">Abschnitt</text>`;
                }
                if (plattenX + endX - spitzeX > 30) {
                    abschnittTexte += `<text x="${rechterAbschnittX}" y="${plattenY - 5}" text-anchor="middle" 
                          fill="#333" font-weight="bold" font-size="12">Abschnitt</text>`;
                }
            } else {
                // Bei normalem Schnitt: Mittig über dem Abschnittbereich
                abschnittTexte = `<text x="${plattenX + endX/2}" y="${plattenY - 5}" text-anchor="middle" 
                      fill="#333" font-weight="bold" font-size="12">Abschnitt</text>`;
            }
            
            return `
                <svg width="100%" height="100%" viewBox="0 0 400 280" style="position: absolute; top: 0; left: 0;">
                    <!-- Plattenhintergrund -->
                    <rect x="${plattenX}" y="${plattenY}" width="${plattenWidth}" height="${plattenHeight}" 
                          fill="#e9ecef" stroke="#999" stroke-width="2" rx="4"/>
                    
                    <!-- Tatsächlich genutzte Plattenbreite -->
                    <rect x="${plattenX}" y="${plattenY}" width="${endX}" height="${plattenHeight}" 
                          fill="#ddd" stroke="#666" stroke-width="2" rx="4"/>
                    
                    <!-- Nutzenbereich (blau) -->
                    ${istSpitzenPlatte ? 
                        `<polygon points="${plattenX},${plattenY + plattenHeight} ${plattenX + endX},${plattenY + plattenHeight} ${plattenX + endX},${nutzenEndY} ${spitzeX},${plattenY} ${plattenX},${nutzenStartY}" fill="#4a90e2" opacity="0.8"/>` :
                        `<polygon points="${plattenX},${plattenY + plattenHeight} ${plattenX + endX},${plattenY + plattenHeight} ${plattenX + endX},${nutzenEndY} ${plattenX},${nutzenStartY}" fill="#4a90e2" opacity="0.8"/>`
                    }
                    
                    <!-- Verschnittbereich (rot) -->
                    ${istSpitzenPlatte ? 
                        `<polygon points="${plattenX},${nutzenStartY} ${spitzeX},${plattenY} ${plattenX + endX},${nutzenEndY} ${plattenX + endX},${plattenY} ${plattenX},${plattenY}" fill="#e74c3c" opacity="0.8"/>` :
                        `<polygon points="${plattenX},${nutzenStartY} ${plattenX + endX},${nutzenEndY} ${plattenX + endX},${plattenY} ${plattenX},${plattenY}" fill="#e74c3c" opacity="0.8"/>`
                    }
                    
                    <!-- Schnittlinie (schwarz) -->
                    ${istSpitzenPlatte ? 
                        `<line x1="${plattenX}" y1="${nutzenStartY}" x2="${spitzeX}" y2="${plattenY}" stroke="#000" stroke-width="3"/>
                         <line x1="${spitzeX}" y1="${plattenY}" x2="${plattenX + endX}" y2="${nutzenEndY}" stroke="#000" stroke-width="3"/>` :
                        `<line x1="${plattenX}" y1="${nutzenStartY}" x2="${plattenX + endX}" y2="${nutzenEndY}" stroke="#000" stroke-width="3"/>`
                    }
                    
                    <!-- Anrisslinien (rot) -->
                    <line x1="${plattenX}" y1="${plattenY + plattenHeight}" x2="${plattenX}" y2="${nutzenStartY}" 
                          stroke="#dc3545" stroke-width="4"/>
                    <line x1="${plattenX + endX}" y1="${plattenY + plattenHeight}" x2="${plattenX + endX}" y2="${nutzenEndY}" 
                          stroke="#dc3545" stroke-width="4"/>
                    
                    <!-- Anrissmaße - beide senkrecht wie links -->
                    <text x="15" y="${nutzenStartY + (plattenHeight - anrissHoeheLinks)/2}" 
                          text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold" 
                          transform="rotate(-90 15 ${nutzenStartY + (plattenHeight - anrissHoeheLinks)/2})">${anreissMasse.links}cm</text>
                    
                    <!-- Rechtes Maß - auch senkrecht (nicht 90° gedreht) -->
                    <text x="${plattenX + endX + 15}" y="${nutzenEndY + (plattenHeight - anrissHoeheRechts)/2}" 
                          text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold" 
                          transform="rotate(-90 ${plattenX + endX + 15} ${nutzenEndY + (plattenHeight - anrissHoeheRechts)/2})">${anreissMasse.rechts}cm</text>
                    
                    <!-- Beschriftungen -->
                    <text x="${plattenX + endX/2}" y="${plattenY + plattenHeight - 15}" text-anchor="middle" 
                          fill="#fff" font-weight="bold" font-size="14" stroke="#000" stroke-width="0.5">Nutzen</text>
                    
                    <!-- Intelligente "Abschnitt" Positionierung -->
                    ${abschnittTexte}
                    
                    ${istLetztePlatte ? `
                    <!-- Letzte Platte Markierung -->
                    <line x1="${plattenX + endX}" y1="10" x2="${plattenX + endX}" y2="${plattenY + plattenHeight + 10}" 
                          stroke="#28a745" stroke-width="3"/>
                    <text x="${plattenX + endX + 5}" y="8" font-size="10" fill="#28a745" font-weight="bold">ENDE</text>
                    ` : ''}
                    
                    ${istSpitzenPlatte ? `
                    <!-- Spitze markieren -->
                    <line x1="${spitzeX}" y1="${plattenY}" x2="${spitzeX}" y2="${plattenY + plattenHeight}" stroke="#ffc107" stroke-width="3"/>
                    <text x="${spitzeX}" y="${plattenY - 20}" text-anchor="middle" font-size="10" fill="#ffc107" font-weight="bold">SPITZE</text>
                    ` : ''}
                </svg>
            `;
        }

        // Anweisungen generieren
        function generateInstructions(item, anreissMasse, type, data) {
            const plattenStart = parseFloat(item.positionVonLinks);
            const plattenBreite = parseFloat(item.plattenbreite);
            
            let instructions = `<strong>Anzeichnen:</strong><br>`;
            
            // Prüfe auf Überhang bei letzter Platte
            let basisBreite = 0;
            switch(type) {
                case 'gleichschenkliges-dreieck':
                case 'ungleichschenkliges-dreieck':
                    basisBreite = parseFloat(data.basisBreite);
                    break;
                case 'trapez':
                case 'trapez-auf-rechteck':
                    basisBreite = parseFloat(data.untereBreite);
                    break;
            }
            
            const originalPlattenEnde = plattenStart + plattenBreite;
            const istLetztePlatte = originalPlattenEnde > basisBreite;
            
            if (istLetztePlatte) {
                const ueberhang = originalPlattenEnde - basisBreite;
                if (ueberhang > 0) {
                    instructions += `• <strong style="color: #dc3545;">ZUERST: Rechts ${(ueberhang * 100).toFixed(0)}cm abschneiden!</strong><br>`;
                }
            }
            
            instructions += `• Von der Unterkante: Links bei ${anreissMasse.links}cm und rechts bei ${anreissMasse.rechts}cm markieren<br>`;
            instructions += `• Diagonale Schnittlinie anzeichnen und oberen Teil absägen<br>`;
            
            // Spezielle Hinweise je nach Typ
            if (type === 'gleichschenkliges-dreieck') {
                const spitzenPosition = parseFloat(data.basisBreite) / 2;
                const ueberdecktSpitze = plattenStart <= spitzenPosition && originalPlattenEnde >= spitzenPosition;
                
                if (ueberdecktSpitze) {
                    const spitzeVonLinks = spitzenPosition - plattenStart;
                    instructions += `• <strong style="color: #dc3545;">ACHTUNG: Diese Platte enthält die Dachspitze bei ${(spitzeVonLinks * 100).toFixed(0)}cm von links!</strong><br>`;
                }
                
                if (anreissMasse.links === anreissMasse.rechts) {
                    instructions += `• <strong style="color: #198754;">TIPP: Symmetrischer Schnitt!</strong><br>`;
                }
            }
            
            if (type === 'ungleichschenkliges-dreieck') {
                const spitzenPosition = parseFloat(data.spitzenPosition);
                const ueberdecktSpitze = plattenStart <= spitzenPosition && originalPlattenEnde >= spitzenPosition;
                
                if (ueberdecktSpitze) {
                    const spitzeVonLinks = spitzenPosition - plattenStart;
                    instructions += `• <strong style="color: #dc3545;">ACHTUNG: Diese Platte enthält die Dachspitze bei ${(spitzeVonLinks * 100).toFixed(0)}cm von links!</strong><br>`;
                }
            }
            
            if (type === 'trapez') {
                const obereBreite = parseFloat(data.obereBreite);
                const untereBreite = parseFloat(data.untereBreite);
                const seitenAbstand = (untereBreite - obereBreite) / 2;
                const linkeObereEcke = seitenAbstand;
                const rechteObereEcke = untereBreite - seitenAbstand;
                
                const ueberdecktLinkeEcke = plattenStart <= linkeObereEcke && originalPlattenEnde >= linkeObereEcke;
                const ueberdecktRechteEcke = plattenStart <= rechteObereEcke && originalPlattenEnde >= rechteObereEcke;
                
                if (ueberdecktLinkeEcke && ueberdecktRechteEcke) {
                    instructions += `• <strong style="color: #dc3545;">ACHTUNG: Diese Platte enthält BEIDE oberen Trapez-Ecken!</strong><br>`;
                } else if (ueberdecktLinkeEcke) {
                    instructions += `• <strong style="color: #dc3545;">ACHTUNG: Diese Platte enthält die LINKE obere Trapez-Ecke!</strong><br>`;
                } else if (ueberdecktRechteEcke) {
                    instructions += `• <strong style="color: #dc3545;">ACHTUNG: Diese Platte enthält die RECHTE obere Trapez-Ecke!</strong><br>`;
                }
            }
            
            if (type === 'trapez-auf-rechteck') {
                const obereBreite = parseFloat(data.obereBreite);
                const untereBreite = parseFloat(data.untereBreite);
                const trapezHoehe = parseFloat(data.trapezHoehe);
                const rechteckHoehe = parseFloat(data.rechteckHoehe);
                const gesamtHoehe = trapezHoehe + rechteckHoehe;
                const seitenAbstand = (untereBreite - obereBreite) / 2;
                const linkeObereEcke = seitenAbstand;
                const rechteObereEcke = untereBreite - seitenAbstand;
                
                const istImMittleren = plattenStart >= linkeObereEcke && originalPlattenEnde <= rechteObereEcke;
                
                if (istImMittleren) {
                    instructions += `• <strong style="color: #28a745;">EINFACH: Diese Platte ist vollständig im Mittelbereich!</strong><br>`;
                    instructions += `• <strong style="color: #28a745;">Waagerechter Schnitt bei ${gesamtHoehe}m Höhe!</strong><br>`;
                } else {
                    instructions += `• <strong style="color: #1976d2;">INFO: Durchgehende Platte über Rechteck (${rechteckHoehe}m) + Trapez (${trapezHoehe}m) = ${gesamtHoehe}m Gesamt</strong><br>`;
                }
            }
            
            return instructions;
        }

        // Alle Platten generieren
        function generateAllPlates(type, data) {
            const container = document.getElementById('plates-container');
            let html = '';
            
            data.schnittliste.forEach((item, index) => {
                html += generatePlate(item, index, type, data);
            });
            
            container.innerHTML = html;
        }

        // Hauptinitialisierung
        function init() {
            console.log('Anrissplan init gestartet');
            
            try {
                const params = getUrlParams();
                console.log('URL Parameters:', params);
                
                if (!params.type || !params.data) {
                    console.log('Keine Parameter gefunden');
                    document.getElementById('plan-title').textContent = 'Fehler: Keine Daten übertragen';
                    document.getElementById('plan-info').innerHTML = '<strong style="color: #dc3545;">Fehler:</strong> Keine gültigen Daten gefunden. Bitte kehren Sie zum Rechner zurück.';
                    return;
                }
                
                planType = params.type;
                planData = decodeData(params.data);
                console.log('Dekodierte Daten:', planData);
                
                if (!planData) {
                    console.log('Daten konnten nicht dekodiert werden');
                    document.getElementById('plan-title').textContent = 'Fehler: Daten beschädigt';
                    document.getElementById('plan-info').innerHTML = '<strong style="color: #dc3545;">Fehler:</strong> Die übertragenen Daten sind beschädigt. Bitte kehren Sie zum Rechner zurück.';
                    return;
                }
                
                console.log('Starte Header-Update');
                updateHeader(planType, planData);
                
                console.log('Starte Übersicht-Generierung');
                generateOverview(planType, planData);
                
                console.log('Starte Platten-Generierung');
                generateAllPlates(planType, planData);
                
                console.log('Anrissplan erfolgreich geladen');
                
                // Analytics
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'anrissplan_viewed', {
                        'event_category': 'anrissplan',
                        'event_label': planType
                    });
                }
                
            } catch (error) {
                console.error('Fehler in init():', error);
                document.getElementById('plan-title').textContent = 'JavaScript-Fehler aufgetreten';
                document.getElementById('plan-info').innerHTML = '<strong style="color: #dc3545;">Fehler:</strong> ' + error.message;
            }
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize tracking and ads based on existing consent
            const cookieConsent = localStorage.getItem('cookieConsent');
            if (cookieConsent === 'all' || localStorage.getItem('analyticsCookies') === 'true') {
                loadAnalytics();
            }
            if (cookieConsent === 'all' || localStorage.getItem('marketingCookies') === 'true') {
                loadAdSense();
            }
            
            // Hauptinitialisierung
            init();
        });
    </script>
</body>
