<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Dachplatten Editor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    .editor-section {
      display: grid;
      gap: 1rem;
      max-width: 400px;
    }
    label {
      display: flex;
      flex-direction: column;
      font-weight: bold;
    }
    input {
      padding: 0.3rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>Dachplatten Editor</h1>

  <section id="geometry-inputs-grid" class="editor-section">
    <!-- Eingabefelder für die gewählte Figur werden hier dynamisch eingefügt -->
  </section>

  <canvas id="shape-canvas" width="400" height="300" style="border:1px solid #ccc; margin-top:2rem;"></canvas>

  <script type="module" src="editor_modular_final.js"></script>
</body>
</html>
