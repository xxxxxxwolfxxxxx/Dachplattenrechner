<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dachplattenrechner – Editor</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Dachplattenrechner</h1>
            <nav class="progress-nav">
                <div class="step completed"><span class="step-number">1</span><span class="step-title">Profil</span></div>
                <div class="step completed"><span class="step-number">2</span><span class="step-title">Dachform</span></div>
                <div class="step active"><span class="step-number">3</span><span class="step-title">Editor</span></div>
                <div class="step"><span class="step-number">4</span><span class="step-title">Berechnung</span></div>
                <div class="step"><span class="step-number">5</span><span class="step-title">Anrissplan</span></div>
            </nav>
        </header>

        <main>
            <section>
                <div class="card">
                    <div class="form-row" style="align-items: center;">
                        <h3 style="margin: 0;">Geometrie-Editor: <span id="current-shape-name">Rechteck</span></h3>
                        <div style="margin-left: auto;">
                            <span>Fläche: <strong id="calc-area">0 m²</strong></span> &nbsp;&nbsp;
                            <span>Umfang: <strong id="calc-perimeter">0 m</strong></span>
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 20px;">
                        <button class="btn btn-secondary" id="btn-mirror-horizontal">H-Spiegel</button>
                        <button class="btn btn-secondary" id="btn-mirror-vertical">V-Spiegel</button>
                        <button class="btn btn-secondary" id="btn-rotate-left">↺ 90°</button>
                        <button class="btn btn-secondary" id="btn-rotate-right">↻ 90°</button>
                        <button class="btn btn-secondary" id="btn-water-flow">Wasserlauf</button>
                        <button class="btn btn-secondary" id="btn-traufe">Traufe</button>
                        <button class="btn btn-secondary" id="btn-flip">Umdrehen</button>
                        <button class="btn btn-danger" id="btn-reset">Reset</button>
                    </div>

                    <div class="form-row" style="margin-top: 20px;" id="geometry-inputs-grid">
                        <!-- Eingabefelder dynamisch -->
                    </div>
                </div>

                <div class="card" style="padding: 10px;">
                    <div class="canvas-wrapper" style="margin: 0 auto;">
                        <svg id="main-svg" width="600" height="400" viewBox="0 0 600 400">
                            <defs>
                                <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
                                    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#grid)" />
                            <line x1="300" y1="0" x2="300" y2="400" stroke="#c0c0c0" stroke-width="2"/>
                            <line x1="0" y1="200" x2="600" y2="200" stroke="#c0c0c0" stroke-width="2"/>
                            <g id="roof-shape"></g>
                            <g id="dimensions"></g>
                        </svg>
                    </div>
                </div>
            </section>

            <div class="navigation-buttons">
                <button type="button" class="btn btn-secondary" id="btn-back">← Zurück zur Dachform</button>
                <button type="button" class="btn btn-primary" id="btn-continue">Weiter zur Berechnung →</button>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Dachplattenrechner</p>
        </footer>
    </div>

    <script src="editor.js"></script>
</body>
</html>
